name: Bug report
description: Something isn't working
labels: bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. v0.1.0
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 24.04
  - type: input
    id: model
    attributes:
      label: Ollama model (if relevant)
